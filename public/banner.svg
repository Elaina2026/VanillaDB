<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Radial backdrop glow -->
    <radialGradient id="ogGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Logo Cylinder Gradient -->
    <linearGradient id="vdbCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="vdbTopDisk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="vdbMidDisk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="vdbBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#090d16" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />
  <rect width="1200" height="630" fill="url(#ogGrid)" />

  <!-- Logo Group -->
  <g transform="translate(140, 165) scale(0.6)">
    <!-- Layer 3: Bottom Disk -->
    <g transform="translate(0, 140)">
      <path d="M 126 180 A 130 46 0 0 0 386 180 V 235 A 130 46 0 0 1 126 235 Z" fill="url(#vdbCylinder)" stroke="#1e40af" stroke-width="4" stroke-linejoin="round" />
      <ellipse cx="256" cy="180" rx="130" ry="46" fill="url(#vdbMidDisk)" stroke="#3b82f6" stroke-width="3" />
    </g>

    <!-- Layer 2: Middle Disk -->
    <g transform="translate(0, 70)">
      <path d="M 126 180 A 130 46 0 0 0 386 180 V 235 A 130 46 0 0 1 126 235 Z" fill="url(#vdbCylinder)" stroke="#1e40af" stroke-width="4" stroke-linejoin="round" />
      <ellipse cx="256" cy="180" rx="130" ry="46" fill="url(#vdbMidDisk)" stroke="#3b82f6" stroke-width="3" />
    </g>

    <!-- Layer 1: Top Disk -->
    <g transform="translate(0, 0)">
      <path d="M 126 180 A 130 46 0 0 0 386 180 V 235 A 130 46 0 0 1 126 235 Z" fill="url(#vdbCylinder)" stroke="#1e40af" stroke-width="4" stroke-linejoin="round" />
      <ellipse cx="256" cy="180" rx="130" ry="46" fill="url(#vdbTopDisk)" stroke="#93c5fd" stroke-width="6" />
    </g>

    <!-- Lightning V-Bolt -->
    <path
      d="M 226 105 L 278 180 L 246 192 L 298 290 L 244 206 L 274 194 Z"
      fill="url(#vdbBolt)"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linejoin="round"
      filter="url(#glow)"
    />
  </g>

  <!-- Title & Description Text -->
  <text x="500" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">
    VanillaDatabase
  </text>

  <rect x="500" y="305" width="220" height="28" rx="14" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" />
  <circle cx="516" cy="319" r="4" fill="#38bdf8" />
  <text x="528" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="1">
    SQLITE CLOUD ENGINE
  </text>

  <text x="500" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#9ca3af" width="560">
    High-Performance SQLite Cloud Infrastructure &amp; Realtime API
  </text>

  <!-- Badges / Features -->
  <g transform="translate(500, 425)">
    <rect x="0" y="0" width="130" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="65" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d1d5db">Multi-Tenant</text>

    <rect x="145" y="0" width="130" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="210" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d1d5db">AES-256 Rest</text>

    <rect x="290" y="0" width="130" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="355" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d1d5db">Realtime SSE</text>

    <rect x="435" y="0" width="130" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="500" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d1d5db">Vector Search</text>
  </g>
</svg>

name: Bug Report
description: Create a report to help us identify and fix an issue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please ensure you do **NOT** post sensitive credentials, API keys, private passwords, or private database contents.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start VanillaDatabase with `npm start`
        2. Execute POST request to /v1/databases/db_123/query
        3. Observe error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js Version
      placeholder: "e.g. v22.13.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Ubuntu 24.04 / macOS 15 / Windows 10"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Server Logs
      description: Copy relevant logs from terminal output. (Sanitize any private database data first).
      render: shell

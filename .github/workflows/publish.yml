name: Publish Packages to NPM and PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        registry-url: 'https://registry.npmjs.org'

    - name: Build TypeScript SDK
      run: |
        npm install
        cd sdk/typescript
        npm install
        npm run build

    - name: Check NPM Secret and Publish
      working-directory: sdk/typescript
      run: |
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "::warning ::NPM_TOKEN secret is not set in repository settings. Skipping NPM publish."
        else
          npm publish --access public
        fi
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: python -m pip install --upgrade pip build twine

    - name: Build Python Package
      working-directory: sdk/python
      run: python -m build

    - name: Check PyPI Secret and Publish
      working-directory: sdk/python
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::warning ::PYPI_API_TOKEN secret is not set in repository settings. Skipping PyPI publish."
        else
          twine upload --verbose --skip-existing dist/*
        fi
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

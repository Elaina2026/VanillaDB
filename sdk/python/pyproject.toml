[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vanilladatabase"
version = "1.3.2"
authors = [
  { name="Elaina2026", email="ariaasamane@gmail.com" },
]
description = "Official Python SDK for VanillaDatabase - Multi-tenant SQLite Engine with Realtime & Media Storage"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Elaina2026/VanillaDB"
"Bug Tracker" = "https://github.com/Elaina2026/VanillaDB/issues"
